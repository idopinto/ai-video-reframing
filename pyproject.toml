[project]
name = "ai-video-reframing"
version = "0.1.0"
description = "Automatic 16:9 → 9:16 video reframing using object detection, tracking, face-aware framing, temporal smoothing, and FFmpeg."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "gradio>=5.49",
    "lap>=0.5.13",
    "opencv-python-headless>=4.10",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.14",
    "streamlit>=1.40",
    "tqdm>=4.66",
    "ultralytics>=8.3",
]

[project.scripts]
smartcrop = "smartcrop.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartcrop"]

[tool.hatch.build.targets.wheel.force-include]
"smartcrop/trackers/botsort_reid.yaml" = "smartcrop/trackers/botsort_reid.yaml"
